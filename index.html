<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora - build an app, website or game by describing it</title>
<meta name="description" content="Describe what you want in plain words. Nexora plans it, builds it, tests it and hands you something that works. Free to try.">
<meta property="og:type" content="website"><meta property="og:site_name" content="Nexora">
<meta property="og:title" content="Nexora - build an app, website or game by describing it">
<meta property="og:description" content="Plain English in, a working app out. Free to try.">
<meta property="og:image" content="https://craxxy64-arch.github.io/nexora-link/card.png"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://craxxy64-arch.github.io/nexora-link/card.png">
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#faf7f2;color:#191817;font:16px system-ui,sans-serif;text-align:center}
.b{max-width:340px;padding:24px}.d{width:10px;height:10px;border-radius:50%;background:#f0653a;display:inline-block;margin-right:8px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.25}}a{color:#c2410c}</style></head>
<body><div class="b"><p id="m"><span class="d"></span>Opening Nexora&hellip;</p><p style="font-size:13px;color:#777">If nothing happens, <a id="l" href="link.json">tap here</a>.</p></div>
<script>
var n=0;
function addr(){return fetch("link.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){return j.url})}
function alive(u){return fetch(u+"ping.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw 0})}
function step(){
  addr().then(function(u){
    document.getElementById("l").href=u;
    return alive(u).then(function(){location.replace(u+location.search+location.hash)});
  }).catch(function(){
    n++;
    document.getElementById("m").textContent=n>2?"Nexora is restarting. This page tries again by itself.":"Opening Nexora...";
    setTimeout(step,5000);
  });
}
step();
</script></body></html>
